name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p public/img
          cp *.html *.css *.js *.svg public/
          for f in _b64/img/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "public/img/$n"; done
          touch public/.nojekyll
          ls -la public public/img
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
